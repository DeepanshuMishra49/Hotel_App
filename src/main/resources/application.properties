spring.application.name=HousingApp

# MySQL datasource configuration (change to match your local setup)
spring.datasource.url=jdbc:mysql://localhost:3306/housingdb 
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Global CORS (works together with CorsConfig)
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# JWT (change this in production; must be >= 32 characters)
app.jwt.secret=change-this-secret-to-a-long-random-string-32chars-min
app.jwt.expiration-seconds=86400
